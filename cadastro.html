<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - CyberPsico</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="topo">
    <h2>CyberPsico</h2>
    <a href="index.html" class="botao">Voltar</a>
  </div>

  <div class="formulario">
    <h1>Cadastro</h1>

    Nome / Apelido:<br>
    <input id="input_nome" type="text"><br>

    E-mail:<br>
    <input id="input_email" type="text"><br>

    Senha:<br>
    <input id="input_senha" type="password"><br>

    <button class="botao" onclick="cadastrar()">Criar conta</button>

    <p id="mensagem"></p>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
